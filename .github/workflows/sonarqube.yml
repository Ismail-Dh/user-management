name: Build and SonarQube Analysis

on:
  push:
    branches: [ main ]

jobs:
  sonar:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # évite les erreurs de sous-modules

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Build & SonarQube Analysis
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $sonarUrl = $env:SONAR_HOST_URL
          $sonarToken = $env:SONAR_TOKEN
          mvn clean verify sonar:sonar -Dsonar.projectKey=TP_SonarQube -Dsonar.host.url=$sonarUrl -Dsonar.token=$sonarToken
