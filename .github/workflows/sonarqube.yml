name: Build and SonarQube Analysis

on:
  push:
    branches: [ main ]

jobs:
  sonar:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout du code
      - uses: actions/checkout@v4
        with:
          submodules: false   # Désactive les sous-modules pour éviter les erreurs

      # 2️⃣ Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      # 3️⃣ Start SonarQube in Docker
      - name: Start SonarQube Docker
        shell: powershell
        run: |
          docker pull sonarqube:10.1-community
          docker run -d --name sonarqube -p 9000:9000 sonarqube:10.1-community
          Start-Sleep -Seconds 60  # Attendre que SonarQube démarre

      # 4️⃣ Build & SonarQube Analysis
      - name: Build & SonarQube Analysis
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        run: |
          $sonarUrl = $env:SONAR_HOST_URL
          $sonarToken = $env:SONAR_TOKEN
          mvn clean verify sonar:sonar `
            -Dsonar.projectKey=TP_SonarQube `
            -Dsonar.host.url=$sonarUrl `
            -Dsonar.login=$sonarToken

      # 5️⃣ Stop SonarQube Docker
      - name: Stop SonarQube Docker
        shell: powershell
        run: |
          docker stop sonarqube
          docker rm sonarqube
